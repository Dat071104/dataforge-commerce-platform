services:
  operational-postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: dataforge_week5
      POSTGRES_PASSWORD: ${WEEK5_SOURCE_PASSWORD:-week5_local_only}
      POSTGRES_DB: dataforge_operational
    ports:
      - "127.0.0.1:${WEEK5_SOURCE_PORT:-55432}:5432"
    volumes:
      - operational_source_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  operational_source_pgdata:
