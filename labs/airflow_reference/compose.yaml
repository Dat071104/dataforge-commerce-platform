services:
  airflow-reference-test:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    user: "50000:0"
    network_mode: none
    environment:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/labs/airflow_reference/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow/airflow.db
      PYTHONPATH: /workspace/labs/airflow_reference/dags
    volumes:
      - .:/workspace/labs/airflow_reference:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        set -euo pipefail &&
        mkdir -p /tmp/airflow &&
        airflow db migrate &&
        python -m unittest discover -s /workspace/labs/airflow_reference/tests -p 'test_*.py' -v &&
        airflow dags test dataforge_week7_local_reference 2026-11-11T06:00:00+00:00

  airflow-scheduler-harness:
    image: apache/airflow:3.4.0-python3.11@sha256:be92e15d57c5be726fc39a91cd09cce8f7488483b67979e0fb74c1a2c7cfb4e2
    user: "50000:0"
    network_mode: none
    environment:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/labs/airflow_reference/harness/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow/airflow.db
      PYTHONPATH: /workspace/labs/airflow_reference/dags:/workspace/labs/airflow_reference/harness
    volumes:
      - .:/workspace/labs/airflow_reference:ro
      - ./harness/no_cloud_credentials.fixture:/run/dataforge/credentials/application_default_credentials.json:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        set -euo pipefail &&
        mkdir -p /tmp/airflow &&
        python /workspace/labs/airflow_reference/harness/run_scheduler_harness.py
