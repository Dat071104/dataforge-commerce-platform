name: dataforge-w8

services:
  postgres:
    image: postgres:16.16-alpine3.23@sha256:c20bbcd4348a9f727d4b9c06e9bf042ca6fa4e90b201edfdfe8daeb200e8ca91
    platform: linux/amd64
    restart: "no"
    env_file:
      - path: ./w8.env
        required: false
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - shared_buffers=64MB
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../labs/operational_source/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./postgres/020_cdc_extensions.sql:/docker-entrypoint-initdb.d/020_cdc_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 384m

  kafka:
    image: confluentinc/cp-kafka:7.9.11.amd64@sha256:fc0ba252389cf7509b92b20ba6d0e2cde92408812c98127d30d3a1810ca41a68
    platform: linux/amd64
    restart: "no"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
      KAFKA_LOG_RETENTION_HOURS: "24"
    ports:
      - "127.0.0.1:19093:19093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1152m

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.11.amd64@sha256:8fa2069cd2a1f22dd32dea021151b90639ed2e2aa8caac63952b094a64374733
    platform: linux/amd64
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx384m
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 640m

  connect:
    image: dataforge/w8-connect:7.9.11-debezium-3.1.3
    platform: linux/amd64
    restart: "no"
    build:
      context: ./connect
      args:
        CONNECT_BASE_IMAGE: confluentinc/cp-kafka-connect:7.9.11.amd64@sha256:82ef611a6547fd513cb52891326c3d5a8a5e30c8ea511e71f9813c93ad98482f
        DEBEZIUM_VERSION: 3.1.3
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: dataforge-w8-connect
      CONNECT_CONFIG_STORAGE_TOPIC: dataforge-w8-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: dataforge-w8-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: dataforge-w8-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:18083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1152m

  spark:
    image: dataforge/w8-spark:3.5.9-delta3.3.3
    platform: linux/amd64
    restart: "no"
    build:
      context: ./spark
    depends_on:
      connect:
        condition: service_healthy
    environment:
      DATAFORGE_W8_BROKERS: kafka:9092
      DATAFORGE_W8_SCHEMA_REGISTRY: http://schema-registry:8081
      DATAFORGE_W8_TOPIC_PREFIX: dataforge
      DATAFORGE_W8_STATE_DIR: /workspace/labs/streaming_cdc/_state
      DATAFORGE_W8_EVIDENCE_DIR: /workspace/docs/week8/evidence
      DATAFORGE_W8_TEST_EVENTS_DIR: /workspace/labs/streaming_cdc/_state/test_events
      SPARK_LOCAL_IP: 127.0.0.1
    ports:
      - "127.0.0.1:14040:4040"
      - "127.0.0.1:17079:7079"
    volumes:
      - ../../:/workspace:ro
      - ./_state:/workspace/labs/streaming_cdc/_state
      - ../../docs/week8/evidence:/workspace/docs/week8/evidence
    command: ["python", "-m", "labs.streaming_cdc.stream"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; health=json.load(urllib.request.urlopen('http://127.0.0.1:7079/health',timeout=2)); assert health['status']=='ready'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 2048m

volumes:
  postgres_data:
  kafka_data:
