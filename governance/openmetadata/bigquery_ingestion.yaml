source:
  type: bigquery
  serviceName: dataforge_w9_catalog
  serviceConnection:
    config:
      type: BigQuery
      scheme: bigquery
      hostPort: bigquery.googleapis.com
      credentials:
        gcpConfig:
          type: gcp_adc
          projectId:
            - dataforge-p7-lab-d0f725
      includePolicyTags: false
  sourceConfig:
    config:
      type: DatabaseMetadata
      databaseFilterPattern:
        includes:
          - ^dataforge-p7-lab-d0f725$
      schemaFilterPattern:
        includes:
          - ^(w9_drill|dataforge_dq|restricted_pii|pii_safe|dbt_ci_pr_.*)$
      includeTables: true
      includeViews: true
      includeTags: false
      includeOwners: false
      includeStoredProcedures: false
      includeDDL: false
      includeCustomProperties: false
      markDeletedTables: false
      threads: 1
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: no-auth
    verifySSL: ignore
    storeServiceConnection: false
