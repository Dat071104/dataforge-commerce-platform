source:
  type: dbt
  serviceName: dataforge_w9_catalog
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        dbtManifestFilePath: /workspace/dbt/dataforge/target/manifest.json
      dbtUpdateDescriptions: true
      includeTags: true
      dbtClassificationName: DataForge
      dbtUpdateOwners: false
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      # Placeholder only; the workflow renders a masked copy under RUNNER_TEMP.
      jwtToken: __OM_JWT_TOKEN__
    verifySSL: ignore
    storeServiceConnection: false
