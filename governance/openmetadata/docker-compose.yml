# Ephemeral CI-only profile. It is started only by .github/workflows/week9-catalog.yml.
services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openmetadata_db
      POSTGRES_USER: openmetadata_user
      POSTGRES_PASSWORD: openmetadata_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmetadata_user -d openmetadata_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [catalog]

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "OpenMetadata_password123!!!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [catalog]

  migrate:
    image: docker.getcollate.io/openmetadata/server:2.0.7
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    environment: &openmetadata_environment
      OPENMETADATA_CLUSTER_NAME: dataforge-w9-catalog
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: INFO
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_PARAMS: "sslmode=disable"
      DB_USE_SSL: "false"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      DB_HOST: postgresql
      DB_PORT: "5432"
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASSWORD: ""
      SEARCH_TYPE: opensearch
      # OpenMetadata 2.0.7 rejects `no-auth` (run 44765152599). Use the built-in basic provider,
      # the default authorizer, and the default ingestion-bot JWT; all credentials are throwaway CI values.
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "false"
      OPENMETADATA_HEAP_OPTS: "-Xms512m -Xmx768m"
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: "no"
    networks: [catalog]

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:2.0.7
    environment: *openmetadata_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8585:8585"
      - "127.0.0.1:8586:8586"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8586/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [catalog]

networks:
  catalog:
    name: dataforge-w9-catalog-net
