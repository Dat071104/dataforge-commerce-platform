legal_mapping:
  status: OFFICIAL_TEXT_VERIFIED; application to a real use case requires privacy counsel review.
  reviewed_on: '2026-11-18'
  law_91_2025_QH15:
    effective_date: '2026-01-01'
    article_20: Defines cross-border personal-data transfer cases and requires an impact-assessment dossier within
      60 days of the first transfer, subject to statutory exceptions.
    article_39: 'Transition only: existing processing already consented to or agreed under Decree 13 may continue;
      previously accepted impact-assessment dossiers remain in use, while later updates follow the new Law. This
      does not keep Decree 13 generally in force.'
    official_metadata: https://vanban.chinhphu.vn/?docid=214590&pageid=27160
    official_text_pdf: https://congbao.chinhphu.vn/tai-ve-van-ban-so-91-2025-qh15-45578-57730?format=pdf
  decree_356_2025_ND_CP:
    effective_date: '2026-01-01'
    article_42_clause_2: Decree 13/2023/NĐ-CP is repealed from the effective date of Decree 356.
    official_metadata: https://vanban.chinhphu.vn/?docid=216387&pageid=27160&typegroupid=4
    official_text_pdf: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/356-nd.signed.pdf
  decree_13_2023_ND_CP:
    current_status: Not generally in force from 2026-01-01; only the specific transition in Article 39 of Law 91
      applies to qualifying pre-existing consent/agreements and already accepted dossiers.
    official_metadata: https://vanban.chinhphu.vn/?docid=207759&pageid=27160
  region_implication: The configured us-central1 region is in the United States. If real personal data collected
    in Vietnam were stored or processed there, this would be a cross-border-transfer scenario under Article 20;
    no exception is assumed. This work uses synthetic data only.
  phone_prefix_source: https://english.mic.gov.vn/vietnamese-mobile-carriers-roll-out-new-prefixes-197137770.htm
