version: 1
reviewed_on: '2026-11-18'
metadata_contract:
  required_fields:
  - classification
  - pii_type
  - purpose
  - retention_days
  coverage: Every declared source, model, snapshot, and Gold output column is classified.
  synthetic_data_label: data_classification=synthetic
classification_levels:
  public: Approved for public or broad non-sensitive analytics.
  internal: Operational or generalized data limited to project users.
  confidential: Commercial metrics, linkable business identifiers, masked values, or pseudonymous tokens.
  restricted: Direct personal identifiers; raw values remain in restricted_pii.
retention_defaults_days:
  public: 3650
  internal: 365
  confidential: 365
  restricted: 7
pii_handling:
  raw_dataset: restricted_pii.customer_profile
  safe_mart: pii_safe.dim_customer_profile_safe
  hmac_secret: Secret Manager secret w9-pii-hmac-key; value never appears in SQL, logs, or receipts.
  cccd_prefix: 999 (reserved synthetic prefix; never a valid citizen identifier in the fixture contract).
  email_domain: '@example.com (reserved example domain).'
  phone_prefix: +84-000- (deliberately synthetic prefix outside the Vietnamese mobile prefixes listed by MIC; use
    only in local synthetic fixtures).
  phone_allocation_evidence: The exact phone prefix is a fixture-only invalid pattern; the linked MIC source lists
    mobile prefixes in 03/05/07/08/09 ranges. This is not represented as an exhaustive subscriber-number allocation
    registry.
  source_class: Faker locale vi_VN, fixed seed; generator pins Faker for reproducible name and birth-date outputs.
