name: Week 8 CDC

on:
  pull_request:
    paths:
      - "labs/streaming_cdc/**"
      - "tests/streaming_cdc/**"
      - "docs/week8/**"
      - "docs/SYLLABUS_COVERAGE.md"
      - ".github/workflows/week8-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week8-cdc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (local Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/streaming_cdc/requirements-dev.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Week 8 test dependencies
        run: python -m pip install --disable-pip-version-check -r labs/streaming_cdc/requirements-dev.txt

      - name: Lint Week 8 code and tests
        run: ruff check labs/streaming_cdc tests/streaming_cdc

      - name: Run Week 8 unit tests
        run: python -m pytest -q tests/streaming_cdc

  integration:
    name: Compose integration (T1-T7)
    if: github.event_name == 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_DATAFORGE_W8_INTEGRATION: "1"
      DATAFORGE_W8_STARTUP_BUDGET_SEC: "900"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/streaming_cdc/requirements-integration.txt

      - name: Install integration test dependencies
        run: python -m pip install --disable-pip-version-check -r labs/streaming_cdc/requirements-integration.txt

      - name: Start the pinned Compose stack
        run: python -m labs.streaming_cdc.cli up

      - name: Run integration tests T1-T7
        run: python -m pytest -q tests/streaming_cdc/integration

      - name: Capture Compose logs
        if: always()
        continue-on-error: true
        run: docker compose --project-name dataforge-w8 --file labs/streaming_cdc/compose.yaml logs --no-color > docs/week8/evidence/compose.log

      - name: Upload Week 8 evidence and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: week8-cdc-evidence-${{ github.sha }}
          path: |
            docs/week8/evidence/**
            labs/streaming_cdc/_state/health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the Week 8 stack
        if: always()
        run: python -m labs.streaming_cdc.cli down --volumes
