name: Week 8 CDC

on:
  pull_request:
    paths:
      - "labs/streaming_cdc/**"
      - "tests/streaming_cdc/**"
      - "docs/week8/**"
      - "docs/SYLLABUS_COVERAGE.md"
      - ".github/workflows/week8-ci.yml"
  push:
    branches:
      - "feat/w8-cdc-streaming"
    paths:
      - "labs/streaming_cdc/**"
      - "tests/streaming_cdc/**"
      - "docs/week8/**"
      - "docs/SYLLABUS_COVERAGE.md"
      - ".github/workflows/week8-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week8-cdc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (local Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/streaming_cdc/requirements-dev.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Week 8 test dependencies
        run: python -m pip install --disable-pip-version-check -r labs/streaming_cdc/requirements-dev.txt

      - name: Lint Week 8 code and tests
        run: ruff check labs/streaming_cdc tests/streaming_cdc

      - name: Run Week 8 unit tests
        run: python -m pytest -q tests/streaming_cdc
