name: Week 9 DataOps foundations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week9-dataops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: DataOps lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Data Contract CLI and pre-commit
        run: python -m pip install --disable-pip-version-check "datacontract-cli==1.2.8" "pre-commit==4.3.0"

      - name: Stage checkout for the full-repository secret scan
        run: git add --all

      - name: Run repository lint hooks
        run: pre-commit run --all-files --show-diff-on-failure

  toolbox:
    name: DataOps toolbox build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build toolbox with gzip layers (no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: deploy/dataops_toolbox
          file: deploy/dataops_toolbox/Dockerfile
          tags: dataforge-dataops-toolbox:ci
          push: false
          outputs: type=docker,name=dataforge-dataops-toolbox:ci,compression=gzip,compression-level=6,force-compression=true

      - name: Smoke test dbt and Data Contract CLI
        run: |
          docker run --rm dataforge-dataops-toolbox:ci dbt --version
          docker run --rm dataforge-dataops-toolbox:ci datacontract --version
          docker run --rm --interactive dataforge-dataops-toolbox:ci python - <<'PY'
          from importlib.metadata import version
          from great_expectations import __version__ as gx_version

          assert version("dbt-bigquery") == "1.11.3"
          assert version("datacontract-cli") == "1.2.8"
          assert gx_version == "1.25.0"
          print(
              f"dbt-bigquery={version('dbt-bigquery')}, "
              f"datacontract-cli={version('datacontract-cli')}, "
              f"GX Core={gx_version}"
          )
          PY
