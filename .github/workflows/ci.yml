name: DataForge CI (Python 3.11 and PostgreSQL 16)
permissions:
  contents: read
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dataforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements-py311.lock -e '.[dev,powerbi]'
      - name: Lint production and test code
        run: ruff check src tests scripts dashboards/P5
      - name: Compile Python source
        run: python -m compileall -q src tests scripts dashboards/P5
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest -q tests dashboards/P5/tests
        env:
          RUN_POSTGRES_TESTS: "0"
      - name: Run isolated PostgreSQL integration tests
        run: python -m pytest -q -o faulthandler_timeout=60 tests dashboards/P5/tests
        env:
          RUN_POSTGRES_TESTS: "1"
      - name: Prepare deterministic synthetic Gold export
        run: |
          dataforge generate --orders 3000 --seed 42
          dataforge ingest
          dataforge db-init
          dataforge db-load
          dataforge db-build
          dataforge db-check --synthetic > db_check.json
          python -c "import json; from pathlib import Path; checks=json.loads(Path('db_check.json').read_text()); failures={name:value for name,value in checks.items() if value != 0}; assert not failures, failures"
          python scripts/verify_financial_controls.py
          python scripts/export_powerbi_gold.py --excel
      - name: Validate Power BI source pack
        run: python dashboards/P5/validate_source_pack.py
