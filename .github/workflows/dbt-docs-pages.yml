name: Publish static dbt docs to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feat/w7-dbt-pages'
      - 'fix/w7-pages-render'
    paths:
      - 'dbt/dataforge/**'
      - 'cloud/jobs/week7/requirements.lock'
      - 'README.md'
      - '.github/workflows/dbt-docs-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/dataforge/**'
      - 'cloud/jobs/week7/requirements.lock'
      - 'README.md'
      - '.github/workflows/dbt-docs-pages.yml'
  workflow_run:
    workflows:
      - Week 9 main artifacts
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: dbt-pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download Week 9 data-quality report
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: week9-dq-report
          path: ${{ runner.temp }}/week9-dq-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked dbt runtime
        run: python -m pip install --disable-pip-version-check -r cloud/jobs/week7/requirements.lock
      - name: Configure Pages metadata
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Parse dbt and generate static docs without warehouse access
        working-directory: dbt/dataforge
        env:
          DBT_TARGET_PATH: ${{ runner.temp }}/dbt-target
          DBT_LOG_PATH: ${{ runner.temp }}/dbt-logs
        run: |
          cp profiles.example.yml profiles.yml
          dbt parse --project-dir . --profiles-dir . --target offline --no-send-anonymous-usage-stats --no-version-check --no-partial-parse
          dbt docs generate --project-dir . --profiles-dir . --target offline --no-compile --empty-catalog --static --no-send-anonymous-usage-stats --no-version-check
      - name: Prepare repository-base static site
        env:
          DBT_TARGET_PATH: ${{ runner.temp }}/dbt-target
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import os
          import html as html_lib
          import subprocess
          import tempfile
          from html.parser import HTMLParser
          from pathlib import Path

          class DocsHTMLParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_head = False
                  self.in_script = False
                  self.head_bases = []
                  self.scripts = []
                  self._script = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'head':
                      self.in_head = True
                  elif tag == 'base' and self.in_head:
                      self.head_bases.append(dict(attrs))
                  elif tag == 'script':
                      self.in_script = True
                      self._script = []

              def handle_data(self, data):
                  if self.in_script:
                      self._script.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.scripts.append(''.join(self._script))
                      self.in_script = False
                  elif tag == 'head':
                      self.in_head = False

          target = Path(os.environ['DBT_TARGET_PATH'])
          report_path = Path(os.environ['RUNNER_TEMP']) / 'week9-dq-report' / 'dq-report.md'
          report_html = None
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run':
              if not report_path.is_file():
                  raise SystemExit('Week 9 DQ report artifact is missing dq-report.md')
              report_text = report_path.read_text(encoding='utf-8')
              report_html = (
                  '<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width, initial-scale=1">'
                  '<title>Week 9 data-quality report</title></head><body>'
                  '<main><h1>Week 9 data-quality report</h1>'
                  '<p><a href="./">Back to dbt docs</a></p>'
                  f'<pre style="white-space:pre-wrap;overflow-wrap:anywhere">{html_lib.escape(report_text)}</pre>'
                  '</main></body></html>'
              )
          static_index = target / 'static_index.html'
          if not static_index.is_file():
              raise SystemExit('dbt static_index.html was not generated')
          html = static_index.read_text(encoding='utf-8')
          base_url = os.environ['PAGES_BASE_URL'].rstrip('/')
          if not base_url:
              raise SystemExit('GitHub Pages base_url is empty')

          source_parser = DocsHTMLParser()
          source_parser.feed(html)
          if html.count('<head>') != 1:
              raise SystemExit('Expected one document head tag')
          if source_parser.head_bases:
              raise SystemExit('Expected no existing base element in dbt document head')
          if len(source_parser.scripts) != 1:
              raise SystemExit('Expected one inline dbt docs script')

          html = html.replace('<head>', f'<head><base href="{base_url}/">', 1)
          canonical = 'href="/overview/"'
          if html.count(canonical) != 1:
              raise SystemExit('Expected one dbt canonical overview link')
          html = html.replace(canonical, f'href="{base_url}/overview/"', 1)
          if 'mart_weather_province_daily' not in html or 'weather_province_daily_demo' not in html:
              raise SystemExit('Static docs do not contain expected mart/exposure lineage')

          prepared_parser = DocsHTMLParser()
          prepared_parser.feed(html)
          if len(prepared_parser.head_bases) != 1:
              raise SystemExit('Prepared site must have exactly one base element in its head')
          if prepared_parser.head_bases[0].get('href') != f'{base_url}/':
              raise SystemExit('Prepared base element does not match the Pages base URL')
          if len(prepared_parser.scripts) != 1:
              raise SystemExit('Prepared site must retain one inline dbt docs script')

          script_path = None
          try:
              with tempfile.NamedTemporaryFile(
                  mode='w', encoding='utf-8', suffix='.js', delete=False
              ) as script_file:
                  script_file.write(prepared_parser.scripts[0])
                  script_path = Path(script_file.name)
              subprocess.run(
                  ['node', '--check', str(script_path)],
                  check=True,
                  capture_output=True,
                  text=True,
                  encoding='utf-8',
                  errors='replace',
              )
          except FileNotFoundError as error:
              raise SystemExit('Node.js is required to syntax-check the dbt docs bundle') from error
          except subprocess.CalledProcessError as error:
              details = (error.stderr or '').strip().splitlines()
              summary = details[-1] if details else 'node --check failed'
              raise SystemExit(f'dbt docs inline JavaScript is invalid: {summary}') from error
          finally:
              if script_path is not None:
                  script_path.unlink(missing_ok=True)

          site = Path('_site')
          site.mkdir(exist_ok=True)
          if report_html is not None:
              (site / 'dq-report.html').write_text(report_html, encoding='utf-8')
              (site / 'dq-report.md').write_text(report_text, encoding='utf-8')
              body_end = '</body>'
              if html.count(body_end) != 1:
                  raise SystemExit('Expected one body end tag to add the Week 9 DQ report link')
              html = html.replace(
                  body_end,
                  '<nav aria-label="Data quality"><a href="dq-report.html">Week 9 data-quality report</a></nav>' + body_end,
                  1,
              )
          (site / 'index.html').write_text(html, encoding='utf-8')
          print('Prepared static dbt docs with valid inline JavaScript and a repository-base URL.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
