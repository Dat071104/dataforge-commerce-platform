[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-vn-commerce"
version = "0.1.0"
description = "Local-first Vietnam commerce order-to-cash analytics reference"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["polars>=1.36.1,<2", "pytest>=8,<10", "ruff>=0.9,<1"]
powerbi = ["openpyxl>=3.1,<4"]
gcp = ["google-cloud-storage>=3.14.1,<4", "google-cloud-bigquery>=3.47.0,<4"]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
